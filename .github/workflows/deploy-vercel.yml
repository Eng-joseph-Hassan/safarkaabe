name: Deploy production to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_J8R68YrF5ebgs0TYPATPN7tZ
      VERCEL_PROJECT_ID: prj_7aJDI4chj8fiiQouWTA9rbePnVlc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add the team-scoped VERCEL_TOKEN secret in GitHub repository settings."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm install --global vercel@64.5.0
      - run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
